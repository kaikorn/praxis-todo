<meta name="apple-mobile-web-app-title" content="To Do">
<title>Praxis</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap');

  :root {
    --bg: #f2f0ec;
    --surface: #ffffff;
    --border: #e0dbd4;
    --text: #1a1814;
    --text-muted: #8a8278;
    --radius: 16px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);

    /* Category colours */
    --steri:    #1b6ca8;  /* blue */
    --praxis:   #2d6a4f;  /* green */
    --abends:   #6a3d9a;  /* purple */
    --montags:  #c9184a;  /* red */
    --dienstags:#d4670a;  /* orange */
    --mittwochs:#0a7a6a;  /* teal */
    --donnerstags:#7b5ea7;/* violet */
    --freitags: #1a7a3c;  /* dark green */
    --monatlich:#8b5e3c;  /* brown */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 100px;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px 12px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 1px 8px rgba(0,0,0,0.06);
  }
  .header-row { display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: var(--text); }
  .logo span { color: var(--praxis); }
  .date-chip {
    font-family: 'DM Mono', monospace;
    font-size: 13px; font-weight: 500;
    color: var(--text-muted);
    background: var(--bg);
    padding: 5px 12px; border-radius: 20px;
  }

  /* Progress bar */
  .progress-wrap { margin-top: 12px; }
  .progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .progress-label { font-size: 13px; font-weight: 600; color: var(--text-muted); }
  .progress-pct { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 700; color: var(--praxis); }
  .progress-track { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; border: 1px solid var(--border); }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--praxis), #52b788); border-radius: 5px; transition: width 0.5s cubic-bezier(0.34,1.56,0.64,1); }

  /* ── TABS ── */
  .tabs {
    display: flex; gap: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 14px 20px;
    border: none; background: transparent;
    font-size: 14px; font-weight: 600;
    color: var(--text-muted);
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .tab.active { color: var(--praxis); border-bottom-color: var(--praxis); }

  /* ── CONTENT ── */
  .content { padding: 20px 20px 20px; }
  .hidden { display: none !important; }

  /* ── CATEGORY GROUP ── */
  .cat-group { margin-bottom: 28px; }
  .tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .subgroup { margin-bottom: 14px; }
  .subgroup-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--text-muted);
    padding: 0 4px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .subgroup-title::before { content:''; flex:1; height:1px; background:var(--border); }
  .cat-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px; padding: 0 4px;
  }
  .cat-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .cat-title { font-size: 13px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); }
  .cat-progress { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--text-muted); background: var(--border); padding: 2px 8px; border-radius: 10px; }

  /* ── TASK TILE ── */
  .task-tile {
    display: flex; align-items: center;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.1s, box-shadow 0.1s;
    min-height: 80px;
    user-select: none;
    -webkit-user-select: none;
  }
  .task-tile:active { transform: scale(0.98); }
  .task-tile.done { opacity: 0.5; }
  .task-tile.done .tile-title { text-decoration: line-through; }

  /* Left colour bar */
  .tile-bar { width: 8px; align-self: stretch; flex-shrink: 0; }

  /* Checkbox area */
  .tile-check {
    width: 44px; height: 80px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .tile-check-inner {
    width: 32px; height: 32px; border-radius: 50%;
    border: 2.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; background: white;
  }
  .task-tile.done .tile-check-inner {
    border-color: transparent;
  }
  .tile-check-inner svg { display: none; }
  .task-tile.done .tile-check-inner svg { display: block; }

  /* Text */
  .tile-body { flex: 1; padding: 14px 14px 14px 4px; min-width: 0; }
  .tile-title { font-size: 13px; font-weight: 600; line-height: 1.3; margin-bottom: 2px; }
  .tile-note { font-size: 11px; color: var(--text-muted); line-height: 1.25; }
  .tile-meta { display: flex; align-items: center; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
  .tile-time {
    font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500;
    padding: 2px 8px; border-radius: 6px;
    background: #fff3ed; color: #e85d04;
  }
  .tile-time.ok { background: #d8f3dc; color: #2d6a4f; }
  .tile-assignee {
    font-size: 12px; font-weight: 700;
    padding: 2px 10px; border-radius: 20px;
    color: white;
  }

  /* ── MEMBER POPUP ── */
  .popup-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 400; align-items: flex-end; justify-content: center;
  }
  .popup-backdrop.open { display: flex; }
  .popup {
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 24px 24px 40px;
    width: 100%; max-width: 600px;
  }
  .popup-title {
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-muted);
    margin-bottom: 20px; text-align: center;
  }
  .popup-task-name {
    font-size: 17px; font-weight: 700; text-align: center;
    margin-bottom: 24px; line-height: 1.3; color: var(--text);
  }
  .member-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .member-btn {
    flex: 1; min-width: 120px; max-width: 160px;
    padding: 20px 16px;
    border-radius: var(--radius); border: none;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    font-size: 18px; font-weight: 800; color: white;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    text-align: center;
  }
  .member-btn:active { transform: scale(0.95); }
  .member-btn .btn-initials { font-size: 28px; display: block; margin-bottom: 4px; }
  .member-btn .btn-name { font-size: 13px; font-weight: 600; opacity: 0.9; display: block; }
  .popup-cancel {
    margin-top: 16px; width: 100%; padding: 14px;
    border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--bg); cursor: pointer;
    font-size: 15px; font-weight: 600; color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
  }

  /* Undo snackbar */
  .snackbar {
    position: fixed; bottom: 90px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1a1814; color: white;
    padding: 12px 20px; border-radius: 24px;
    font-size: 14px; font-weight: 600;
    z-index: 500; opacity: 0;
    transition: all 0.3s; pointer-events: none;
    display: flex; align-items: center; gap: 12px;
    white-space: nowrap; max-width: 90vw;
  }
  .snackbar.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .snackbar-undo {
    background: rgba(255,255,255,0.2); border: none;
    color: white; font-weight: 700; font-size: 13px;
    padding: 4px 10px; border-radius: 8px; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }

  /* ── BOTTOM BAR ── */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 20px 28px;
    display: flex; gap: 10px; align-items: center;
    z-index: 200;
  }
  .export-btn {
    flex: 1; padding: 13px;
    border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--bg); cursor: pointer;
    font-size: 14px; font-weight: 700;
    font-family: 'DM Sans', sans-serif; color: var(--text);
    transition: all 0.15s;
  }
  .export-btn.primary {
    background: var(--praxis); color: white; border-color: var(--praxis);
    box-shadow: 0 4px 14px rgba(45,106,79,0.3);
  }
  .log-count { font-size: 12px; color: var(--text-muted); font-family: 'DM Mono', monospace; white-space: nowrap; }

  /* ── EINKAUF ── */
  .supplier-group { margin-bottom: 24px; }
  .supplier-header {
    font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-muted);
    margin-bottom: 8px; padding: 0 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .supplier-count { background: var(--border); color: var(--text-muted); padding: 1px 8px; border-radius: 10px; font-family: 'DM Mono', monospace; font-size: 11px; }
  .shop-tile {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 8px;
    box-shadow: var(--shadow); border: 1.5px solid var(--border);
    cursor: pointer; min-height: 64px;
    transition: transform 0.1s;
  }
  .shop-tile:active { transform: scale(0.98); }
  .shop-check {
    width: 28px; height: 28px; border-radius: 8px;
    border: 2.5px solid var(--border); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; background: white;
  }
  .shop-tile.bought .shop-check { background: var(--praxis); border-color: var(--praxis); }
  .shop-tile.bought .shop-check::after { content: '✓'; color: white; font-size: 14px; font-weight: 700; }
  .shop-tile.bought .shop-name { text-decoration: line-through; color: var(--text-muted); }
  .shop-name { font-size: 15px; font-weight: 600; flex: 1; }
  .shop-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .shop-add { display: flex; gap: 8px; margin-top: 10px; }
  .shop-input {
    flex: 1; padding: 12px 14px; border-radius: 12px;
    border: 1.5px solid var(--border); background: var(--surface);
    font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--text);
    outline: none;
  }
  .shop-input:focus { border-color: var(--praxis); }
  .shop-add-btn {
    padding: 12px 18px; border-radius: 12px;
    background: var(--praxis); color: white; border: none;
    font-size: 22px; cursor: pointer;
  }

  /* ── LOG MODAL ── */
  .modal-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 300;
    align-items: flex-end; justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 24px 24px 0 0;
    padding: 24px; width: 100%; max-width: 640px;
    max-height: 85vh; overflow-y: auto;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-title-text { font-size: 18px; font-weight: 800; }
  .modal-close {
    background: var(--bg); border: none; width: 34px; height: 34px;
    border-radius: 50%; cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
  }
  .log-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .log-table th { text-align: left; padding: 8px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); border-bottom: 2px solid var(--border); }
  .log-table td { padding: 10px 10px; border-bottom: 1px solid var(--bg); vertical-align: top; }
  .log-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; color: white; font-size: 12px; font-weight: 700; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 15px; }

  /* Daily add */
  .daily-add-wrap { margin: 4px 0 20px; }
  .daily-add-btn {
    width: 100%; padding: 16px 20px;
    border-radius: var(--radius); border: 2px dashed var(--border);
    background: transparent; cursor: pointer;
    font-size: 15px; font-weight: 600; color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.15s;
  }
  .daily-add-btn:active { background: var(--surface); }
  .daily-input-wrap {
    display: none;
    background: var(--surface); border-radius: var(--radius);
    border: 2px solid var(--accent); box-shadow: var(--shadow);
    overflow: hidden;
  }
  .daily-input-wrap.open { display: block; }
  .daily-input-header {
    background: var(--accent); padding: 10px 16px;
    font-size: 12px; font-weight: 700; color: white;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .daily-input-body { padding: 14px 16px; }
  .daily-input {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid var(--border); border-radius: 10px;
    font-size: 15px; font-family: 'DM Sans', sans-serif;
    color: var(--text); background: var(--bg); outline: none;
    margin-bottom: 10px;
  }
  .daily-input:focus { border-color: var(--accent); }
  .daily-input-actions { display: flex; gap: 8px; }
  .daily-confirm-btn {
    flex: 1; padding: 12px; border-radius: 10px;
    background: var(--accent); color: white; border: none;
    font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }
  .daily-cancel-btn {
    padding: 12px 16px; border-radius: 10px;
    background: var(--bg); color: var(--text-muted);
    border: 1.5px solid var(--border);
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }
  .daily-task-tile { border: 2px dashed var(--border) !important; }
  .daily-badge {
    font-size: 10px; font-weight: 700; padding: 2px 7px;
    border-radius: 6px; background: #fff9e6; color: #b8860b;
  }

  /* Colour legend */
  .legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 20px 0; }
  .legend-chip { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="logo">Praxis<span>.</span></div>
    <div class="date-chip" id="dateDisplay"></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-top">
      <span class="progress-label">Heute</span>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('heute')">Heute</button>
  <button class="tab" onclick="switchTab('alle')">Alle Aufgaben</button>
  <button class="tab" onclick="switchTab('einkauf')">🛒 Einkauf</button>
</div>

<!-- Legend -->
<div class="legend" id="legend"></div>

<!-- HEUTE -->
<div class="content" id="viewHeute">
  <div id="taskListHeute"></div>
</div>

<!-- ALLE -->
<div class="content hidden" id="viewAlle">
  <div id="taskListAlle"></div>
</div>

<!-- EINKAUF -->
<div class="content hidden" id="viewEinkauf">

function dateStr(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STATE_KEY)||'{}');
    if (s.date === dateStr(new Date())) {
      (s.tasks||[]).forEach(st => {
        const t = tasks.find(t=>t.id===st.id);
        if (t) { t.done=st.done; t.assignee=st.assignee; }
      });
    }
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({
      date: dateStr(new Date()),
      tasks: tasks.map(t=>({id:t.id, done:t.done, assignee:t.assignee}))
    }));
  } catch(e) {}
}

// ════════════════════════════════════════
// LOG
// ════════════════════════════════════════
function getLog() { try { return JSON.parse(localStorage.getItem(LOG_KEY)||'[]'); } catch(e) { return []; } }
function saveLog(l) { try { localStorage.setItem(LOG_KEY, JSON.stringify(l)); } catch(e) {} }

function addLog(task, assigneeId) {
  const log = getLog();
  const now = new Date();
  log.push({
    d: dateStr(now),
    t: now.toTimeString().slice(0,5),
    id: task.id,
    title: task.title,
    cat: task.category,
    by: assigneeId,
  });
  saveLog(log);
  updateLogCount();
}

function removeLastLog(taskId) {
  const log = getLog();
  const idx = [...log].reverse().findIndex(e=>e.id===taskId);
  if (idx>=0) { log.splice(log.length-1-idx, 1); saveLog(log); updateLogCount(); }
}

function updateLogCount() {
  const n = getLog().length;
  document.getElementById('logCount').textContent = n + ' Einträge';
}

// ════════════════════════════════════════
// PROTON DRIVE EXPORT
// ════════════════════════════════════════
function exportForProton() {
  const log = getLog();
  const today = dateStr(new Date());
  const todayLog = log.filter(e=>e.d===today);

  if (!todayLog.length) {
    alert('Heute wurden noch keine Aufgaben erledigt.');
    return;
  }

  // Compact format: one line per task
  const lines = [
    `PRAXIS TAGES-SICHERUNG ${today}`,
    `Erstellt: ${new Date().toLocaleTimeString('de-CH')}`,
    `Erledigte Aufgaben: ${todayLog.length}`,
    '─'.repeat(40),
    ...todayLog.map(e => `${e.t} | ${e.by} | ${e.title}`),
    '─'.repeat(40),
    `Total Protokoll: ${log.length} Einträge seit Beginn`,
  ];

  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Praxis-${today}.txt`;
  a.click();
  URL.revokeObjectURL(url);

  // Mark the backup task as done if it exists and isn't done yet
  const backupTask = tasks.find(t=>t.id===18);
  if (backupTask && !backupTask.done) {
    // auto-prompt member selection
    openMemberPopup(18);
  }
}

function todayTasks() {
  const dow = new Date().getDay();
  return tasks.filter(t => {
    const c = CATEGORIES[t.category];
    return c && c.days.includes(dow);
  });

function renderHeute() {
  const list = todayTasks();
  const done = list.filter(t=>t.done).length, total = list.length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressPct').textContent = pct+'%';
  document.getElementById('progressFill').style.width = pct+'%';

  const el = document.getElementById('taskListHeute');
  el.innerHTML = '';
  const cats = groupBy(list, 'category');
  Object.entries(cats).forEach(([cat,items]) => {
    el.appendChild(buildCatGroup(cat, items));
  });
  renderDailyTasks(el);
}

  const el = document.getElementById('taskListAlle');

  catOrder.forEach(cat => {

    if (!items.length) return;
    el.appendChild(buildCatGroup(cat, items));

// Thematic subgroups per category
const SUBGROUPS = {
  'täglich Praxis': [
    { label: '🌅 Morgen', ids: [8,81,82,83,84,86,87,104] },
    { label: '📞 Tagsüber', ids: [10,11] },
    { label: '🌆 Abend', ids: [100,88,90,91,92,93,94,95,96,97,12,13,98,85,89,103,105,14] },
  ],
  'täglich Steri': [
    { label: '🌅 Morgen', ids: [1,2,3,4,7] },
    { label: '🌆 Abend', ids: [6] },
  ],
  'immer abends': [
    { label: '🌙 Abendcheck', ids: [15,16,99,18] },
  ],
  'Freitags': [
    { label: '🧹 Reinigung', ids: [25,29,23] },
    { label: '🔧 Geräte & Material', ids: [102,101,30,32] },
    { label: '📋 Organisation', ids: [27,21] },
  ],
};
function buildCatGroup(cat, items) {
  const cfg = CATEGORIES[cat] || { color:'#888' };
  const done = items.filter(t=>t.done).length;
  const grp = document.createElement('div');
  grp.className = 'cat-group';
  const hdr = document.createElement('div');
  hdr.className = 'cat-header';
  hdr.innerHTML = `<div class="cat-dot" style="background:${cfg.color}"></div><span class="cat-title">${cat}</span><span class="cat-progress">${done}/${items.length}</span>`;
  grp.appendChild(hdr);

  const subs = SUBGROUPS[cat];
  if (subs) {
    // Render with named subgroups in 2-col grid
    const allMapped = subs.flatMap(s=>s.ids);
    const unmapped = items.filter(t=>!allMapped.includes(t.id));
    const subsToRender = [...subs];
    if (unmapped.length) subsToRender.push({ label:'📌 Weitere', ids: unmapped.map(t=>t.id) });

    subsToRender.forEach(sub => {
      const subItems = sub.ids.map(id=>items.find(t=>t.id===id)).filter(Boolean);
      if (!subItems.length) return;
      const sg = document.createElement('div');
      sg.className = 'subgroup';
      sg.innerHTML = `<div class="subgroup-title">${sub.label}</div>`;
      const grid = document.createElement('div');
      grid.className = 'tile-grid';
      subItems.forEach(t=>grid.appendChild(buildTile(t)));
      sg.appendChild(grid);
      grp.appendChild(sg);
    });
  } else {
    // Default: plain 2-col grid sorted by time
    const grid = document.createElement('div');
    grid.className = 'tile-grid';
    items.sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')).forEach(t=>grid.appendChild(buildTile(t)));
    grp.appendChild(grid);
  }
  return grp;
}

function buildTile(task) {
  const cfg = CATEGORIES[task.category] || { color:'#888' };
  const tile = document.createElement('div');
  tile.className = 'task-tile' + (task.done?' done':'');
  tile.dataset.id = task.id;
  tile.onclick = () => tileClick(task.id);

  const now = new Date();
  let timeClass = 'ok';
  if (task.time) {
    const [h,m] = task.time.split(':').map(Number);
    if ((h*60+m) < (now.getHours()*60+now.getMinutes()) && !task.done) timeClass = '';
  }

  const assignee = task.assignee ? MEMBERS.find(m=>m.id===task.assignee) : null;

  tile.innerHTML = `
    <div class="tile-bar" style="background:${cfg.color}"></div>
    <div class="tile-check">
      <div class="tile-check-inner" style="${task.done?'background:'+cfg.color+';border-color:'+cfg.color:''}">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <polyline points="2,7 5.5,10.5 12,3.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <div class="tile-body">
      <div class="tile-title">${task.title}</div>
      ${task.note ? `<div class="tile-note">${task.note}</div>` : ''}
      <div class="tile-meta">
        ${task.time ? `<span class="tile-time ${timeClass}">${task.time}</span>` : ''}
        ${assignee ? `<span class="tile-assignee" style="background:${assignee.color}">${assignee.id}</span>` : ''}
      </div>
    </div>`;
  return tile;
}

function tileClick(taskId) {
  const t = tasks.find(t=>t.id===taskId);
  if (!t) return;
  if (t.done) {
    // Undo
    t.done = false;
    t.assignee = null;
    removeLastLog(taskId);
    saveState();
    renderAll();
    return;
  }
  openMemberPopup(taskId);
}

// ════════════════════════════════════════
// MEMBER POPUP
// ════════════════════════════════════════

// Single pending object - avoids all variable confusion
let pending = { type: null, id: null }; // type: 'regular' or 'daily'

function openMemberPopup(taskId) {
  const t = tasks.find(t=>t.id===taskId);
  if (!t) return;
  pending = { type: 'regular', id: taskId };
  showPopup(t.title);
}

function showPopup(title) {
  document.getElementById('popupTaskName').textContent = title;
  const btns = document.getElementById('memberButtons');
  btns.innerHTML = '';
  MEMBERS.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'member-btn';
    btn.style.background = m.color;
    btn.innerHTML = `<span class="btn-initials">${m.id}</span><span class="btn-name">${m.name}</span>`;
    btn.setAttribute('data-member', m.id);
    btns.appendChild(btn);
  });
  document.getElementById('memberPopup').classList.add('open');
}

// Single click handler on the buttons container - avoids closure issues
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('memberButtons').addEventListener('click', e => {
    const btn = e.target.closest('[data-member]');
    if (!btn) return;
    assignMember(btn.getAttribute('data-member'));
  });
});

function assignMember(memberId) {
  closePopup();
  if (pending.type === 'regular') {
    const t = tasks.find(t=>t.id===pending.id);
    if (!t) { pending = {type:null,id:null}; return; }
    t.done = true;
    t.assignee = memberId;
    addLog(t, memberId);
    lastAction = { taskId: t.id };
    saveState();
    renderAll();
    showSnack('✓ ' + t.title.slice(0,28) + '… – ' + memberId);
  } else if (pending.type === 'daily') {
    const daily = getDailyTasks();
    const dt = daily.find(t=>t.id===pending.id);
    if (!dt) { pending = {type:null,id:null}; return; }
    dt.done = true;
    dt.assignee = memberId;
    saveDailyTasks(daily);
    addLog({ id: dt.id, title: dt.title, category: 'Heute (einmalig)' }, memberId);
    renderHeute();
    showSnack('✓ ' + dt.title.slice(0,28) + '… – ' + memberId);
  }
  pending = { type: null, id: null };
}

function closePopup() {
  document.getElementById('memberPopup').classList.remove('open');
  pendingTaskId = null;
}

// ════════════════════════════════════════
// UNDO
// ════════════════════════════════════════
function undoLast() {
  if (!lastAction) return;
  const t = tasks.find(t=>t.id===lastAction.taskId);
  if (!t) return;
  t.done = false;
  t.assignee = null;
  removeLastLog(t.id);
  saveState();
  renderAll();
  lastAction = null;
  hideSnack();
}

// ════════════════════════════════════════
// SNACKBAR
// ════════════════════════════════════════
function showSnack(msg) {
  document.getElementById('snackMsg').textContent = msg;
  document.getElementById('snackbar').classList.add('show');
  clearTimeout(snackTimer);
  snackTimer = setTimeout(hideSnack, 4000);
}
function hideSnack() {
  document.getElementById('snackbar').classList.remove('show');
}

// ════════════════════════════════════════
// SHOPPING
// ════════════════════════════════════════
function renderShopping() {
  const done = shopping.filter(s=>s.bought).length, total = shopping.length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('shopPct').textContent = `${done}/${total}`;
  document.getElementById('shopFill').style.width = pct+'%';

  const el = document.getElementById('shoppingList');
  el.innerHTML = '';
  const bySupplier = groupBy(shopping, 'supplier');
  Object.entries(bySupplier).forEach(([supplier, items]) => {
    const grp = document.createElement('div');
    grp.className = 'supplier-group';
    grp.innerHTML = `<div class="supplier-header">${supplier}<span class="supplier-count">${items.filter(s=>s.bought).length}/${items.length}</span></div>`;
    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'shop-tile' + (item.bought?' bought':'');
      div.onclick = () => { item.bought=!item.bought; renderShopping(); };
      div.innerHTML = `
        <div class="shop-check"></div>
        <div style="flex:1">
          <div class="shop-name">${item.name}</div>
          ${item.desc?`<div class="shop-desc">${item.desc}</div>`:''}
        </div>`;
      grp.appendChild(div);
    });
    el.appendChild(grp);
  });

  // Add row
  const row = document.createElement('div');
  row.className = 'shop-add';
  row.innerHTML = `
    <input class="shop-input" id="newShopItem" placeholder="Artikel hinzufügen…">
    <input class="shop-input" id="newShopSupplier" placeholder="Lieferant" style="max-width:130px">
    <button class="shop-add-btn" onclick="addShopItem()">+</button>`;
  el.appendChild(row);
}

function addShopItem() {
  const name = document.getElementById('newShopItem').value.trim();
  const supplier = document.getElementById('newShopSupplier').value.trim() || 'Sonstiges';
  if (!name) return;
  shopping.push({id:Date.now(), supplier, name, desc:'', bought:false});
  renderShopping();
  document.getElementById('newShopItem').value='';
  document.getElementById('newShopSupplier').value='';
}

// ════════════════════════════════════════
// LOG MODAL
// ════════════════════════════════════════
function openLog() {
  const log = getLog().slice().reverse();
  const el = document.getElementById('logContent');
  if (!log.length) {
    el.innerHTML = '<div class="empty-state">Noch keine Einträge im Protokoll.</div>';
  } else {
    const mc = id => { const m=MEMBERS.find(m=>m.id===id); return m?m.color:'#888'; };
    el.innerHTML = '<table class="log-table"><thead><tr><th>Datum</th><th>Zeit</th><th>Aufgabe</th><th>Von</th></tr></thead><tbody>'+
      log.map(e=>`<tr>
        <td style="font-family:'DM Mono',monospace;font-size:12px;white-space:nowrap">${e.d}</td>
        <td style="font-family:'DM Mono',monospace;font-size:12px">${e.t}</td>
        <td style="font-size:13px">${e.title.slice(0,35)}${e.title.length>35?'…':''}</td>
        <td><span class="log-badge" style="background:${mc(e.by)}">${e.by}</span></td>
      </tr>`).join('')+
      '</tbody></table>';
  }
  document.getElementById('logModal').classList.add('open');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ════════════════════════════════════════
// LEGEND
// ════════════════════════════════════════
function renderLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = Object.entries(CATEGORIES)
    .filter(([,v])=>v.days.length>0||true)
    .map(([name,cfg])=>`<div class="legend-chip"><div class="legend-dot" style="background:${cfg.color}"></div>${name}</div>`)
    .join('');
}

// ════════════════════════════════════════
// TABS
// ════════════════════════════════════════
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach((t,i)=>
    t.classList.toggle('active', ['heute','alle','einkauf'][i]===tab)
  );
  document.getElementById('viewHeute').classList.toggle('hidden', tab!=='heute');
  document.getElementById('viewAlle').classList.toggle('hidden', tab!=='alle');
  document.getElementById('viewEinkauf').classList.toggle('hidden', tab!=='einkauf');
}

function renderAll() { renderHeute(); renderAlle(); }

// ════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════
function groupBy(arr,key){return arr.reduce((a,i)=>({...a,[i[key]]:[...(a[i[key]]||[]),i]}),{});}

// Close modals on backdrop click
['memberPopup','logModal'].forEach(id=>{
  document.getElementById(id).addEventListener('click', e=>{
    if(e.target===document.getElementById(id)) {
      if(id==='memberPopup') closePopup(); else closeModal(id);
    }
  });
});

// ════════════════════════════════════════
// DAILY TASKS (einmalig, heute)
// ════════════════════════════════════════
const DAILY_KEY = 'praxis_daily_v2';

function getDailyTasks() {
  try {
    const d = JSON.parse(localStorage.getItem(DAILY_KEY)||'{}');
    if (d.date === dateStr(new Date())) return d.tasks || [];
    return []; // new day → empty
  } catch(e) { return []; }
}

function saveDailyTasks(tasks) {
  try {
    localStorage.setItem(DAILY_KEY, JSON.stringify({
      date: dateStr(new Date()),
      tasks
    }));
  } catch(e) {}
}

function openDailyInput() {
  document.getElementById('dailyAddBtn').style.display = 'none';
  const wrap = document.getElementById('dailyInputWrap');
  wrap.classList.add('open');
  document.getElementById('dailyInput').focus();
}

function closeDailyInput() {
  document.getElementById('dailyAddBtn').style.display = 'flex';
  document.getElementById('dailyInputWrap').classList.remove('open');
  document.getElementById('dailyInput').value = '';
}

function confirmDailyTask() {
  const val = document.getElementById('dailyInput').value.trim();
  if (!val) return;
  const daily = getDailyTasks();
  daily.push({ id: Date.now(), title: val, done: false, assignee: null });
  saveDailyTasks(daily);
  closeDailyInput();
  renderHeute();
}

function toggleDailyDone(id) {
  const daily = getDailyTasks();
  const t = daily.find(t=>t.id===id);
  if (!t) return;
  if (t.done) {
    t.done = false; t.assignee = null;
    saveDailyTasks(daily);
    renderHeute();
    return;
  }
  pending = { type: 'daily', id: id };
  showPopup(t.title);
}


function renderDailyTasks(container) {
  const daily = getDailyTasks();
  const wrap = document.createElement('div');
  wrap.className = 'daily-add-wrap';

  // Render existing daily tasks
  if (daily.length) {
    const grid = document.createElement('div');
    grid.className = 'tile-grid';
    grid.style.marginBottom = '10px';
    daily.forEach(t => {
      const tile = document.createElement('div');
      tile.className = 'task-tile daily-task-tile' + (t.done?' done':'');
      tile.onclick = () => toggleDailyDone(t.id);
      const assignee = t.assignee ? MEMBERS.find(m=>m.id===t.assignee) : null;
      tile.innerHTML = `
        <div class="tile-bar" style="background:#b8860b"></div>
        <div class="tile-check">
          <div class="tile-check-inner" style="${t.done?'background:#b8860b;border-color:#b8860b':''}">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <polyline points="2,7 5.5,10.5 12,3.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
        <div class="tile-body">
          <div class="tile-title">${t.title}</div>
          <div class="tile-meta">
            <span class="daily-badge">Heute</span>
            ${assignee ? `<span class="tile-assignee" style="background:${assignee.color}">${assignee.id}</span>` : ''}
          </div>
        </div>`;
      grid.appendChild(tile);
    });
    wrap.appendChild(grid);
  }

  // Add button
  const btn = document.createElement('button');
  btn.className = 'daily-add-btn';
  btn.id = 'dailyAddBtn';
  btn.innerHTML = '＋ Aufgabe für heute hinzufügen';
  btn.onclick = openDailyInput;
  wrap.appendChild(btn);

  // Input
  const inputWrap = document.createElement('div');
  inputWrap.className = 'daily-input-wrap';
  inputWrap.id = 'dailyInputWrap';
  inputWrap.innerHTML = `
    <div class="daily-input-header">📌 Einmalige Aufgabe für heute</div>
    <div class="daily-input-body">
      <input class="daily-input" id="dailyInput" type="text" placeholder="z.B. Patient Müller zurückrufen…">
      <div class="daily-input-actions">
        <button class="daily-confirm-btn" onclick="confirmDailyTask()">Hinzufügen</button>
        <button class="daily-cancel-btn" onclick="closeDailyInput()">Abbrechen</button>
      </div>
    </div>`;
  wrap.appendChild(inputWrap);

  container.appendChild(wrap);

  // Enter key support
  setTimeout(() => {
    const inp = document.getElementById('dailyInput');
    if (inp) inp.addEventListener('keydown', e => { if(e.key==='Enter') confirmDailyTask(); });
  }, 100);
}

// ════════════════════════════════════════
// INIT
// ════════════════════════════════════════
function init() {
  loadState();
  const now = new Date();
  const days = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  const months = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  document.getElementById('dateDisplay').textContent = `${days[now.getDay()]}, ${now.getDate()}. ${months[now.getMonth()]}`;
  renderLegend();
  renderAll();
  renderShopping();
  updateLogCount();
}

init();
</script>
